- name: "Weakly-Supervised, Self-Supervised, and Meta-Learning for Digital Cytology"
  url: "/research/digital_cytology"
  img: "/assets/images/CytologyCells.jpg"
  img_alt: "Papanicolaou stain stained epithelial cells, as viewed in a microscope"
  description: "High mortality in oral cancer is largely due to late diagnosis.
    Brush sampling and cytological analysis is efficient for early detection of cancer, but the analysis 
    is costly and requires highly skilled expertise. 
    We are developing methods for efficient AI-suppoerted oral cancer screening, to 
    radically reduce analysis costs while at the same time increase speed and diagnostic accuracy."
